version: '3.8'

services:
  user-management-web:
    build:
      context: .
      dockerfile: UserManagement.Web/Dockerfile
    image: usermanagement-web:latest
    ports:
      - "8080:8080"
      - "8081:8081"

  user-management-api:
    build:
      context: .
      dockerfile: UserManagement.Api/Dockerfile
    image: usermanagement-api:latest
    ports:
      - "8082:8080"
      - "8083:8081"
